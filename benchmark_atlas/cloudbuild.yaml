steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/cloud-run-job', 'benchmark_atlas/.']

  # Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cloud-run-job']

  # Deploy the Cloud Run Job
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'jobs', 'update', 'benchmark-atlas', '--image', 'gcr.io/$PROJECT_ID/cloud-run-job', '--region', 'europe-west3']

